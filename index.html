<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavarropas Qué Facha</title>
<style>
  :root{
    --bg:#0f1320; --panel:#f2f4f8; --panel-2:#dfe4ee; --metal:#c9d0dc;
    --ink:#1b2030; --ink-soft:#5b6479; --accent:#2fd6a5; --accent-2:#1aa8ff;
    --warn:#ff6b6b; --glass:#7fc7e8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:24px 16px 40px;
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    color:#e8ecf5;
    background:radial-gradient(1200px 700px at 50% -10%,#1d2540,#0f1320 60%);
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  h1{margin:0; font-size:clamp(20px,4.5vw,30px); letter-spacing:.5px; text-align:center}
  h1 span{color:var(--accent)}
  .sub{margin:0; color:#93a0bb; font-size:13px; text-align:center}

  /* ---------- máquina ---------- */
  .machine{
    position:relative; width:min(380px,92vw); border-radius:26px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 #fff;
    padding:18px; color:var(--ink);
  }
  .machine.shake{animation:shake .18s linear infinite}
  @keyframes shake{
    0%{transform:translate(0,0)} 25%{transform:translate(-1.5px,1px)}
    50%{transform:translate(1px,-1.5px)} 75%{transform:translate(1.5px,1px)} 100%{transform:translate(0,0)}
  }

  /* panel superior */
  .top{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .brand{font-weight:800; font-size:13px; letter-spacing:2px; color:var(--ink-soft)}
  .leds{margin-left:auto; display:flex; gap:6px}
  .led{width:9px;height:9px;border-radius:50%;background:#b6bdca;box-shadow:inset 0 0 3px rgba(0,0,0,.35)}
  .led.on{background:var(--accent); box-shadow:0 0 10px var(--accent)}
  .led.warn.on{background:var(--warn); box-shadow:0 0 10px var(--warn)}

  .display{
    background:#0e1a16; color:var(--accent); border-radius:10px; padding:10px 12px;
    font-family:"Courier New",monospace; font-weight:700; letter-spacing:1px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.7);
  }
  .display .phase{font-size:13px; text-transform:uppercase}
  .display .time{font-size:20px; font-variant-numeric:tabular-nums}

  /* puerta */
  .door-wrap{display:flex; justify-content:center; margin:18px 0 6px}
  .door{
    position:relative; width:210px; height:210px; border-radius:50%;
    background:conic-gradient(from 210deg,#eceff5,#c3cad8,#eceff5,#b9c1d0,#eceff5);
    display:grid; place-items:center;
    box-shadow:0 8px 20px rgba(0,0,0,.28), inset 0 2px 4px #fff;
  }
  .glass{
    position:relative; width:158px; height:158px; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 32% 28%,#eaf7ff 0 12%,#a9d6ea 45%,#4e8ca8 100%);
    box-shadow:inset 0 0 26px rgba(0,0,0,.5);
  }
  .drum{
    position:absolute; inset:0; border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0 6deg, transparent 6deg 18deg);
  }
  .spinning .drum{animation:spin 2.6s linear infinite}
  .fast .drum{animation-duration:.32s}
  @keyframes spin{to{transform:rotate(360deg)}}

  .water{
    position:absolute; left:-10%; right:-10%; bottom:0; height:0;
    background:linear-gradient(180deg,rgba(120,200,235,.85),rgba(40,120,170,.95));
    transition:height .6s ease;
  }
  .water::before{
    content:""; position:absolute; top:-10px; left:0; right:0; height:20px;
    background:radial-gradient(ellipse at 25% 100%,rgba(180,230,255,.9) 0 40%,transparent 41%),
               radial-gradient(ellipse at 75% 100%,rgba(180,230,255,.9) 0 40%,transparent 41%);
  }
  .clothes{position:absolute; inset:0}
  .cloth{
    position:absolute; width:34px; height:24px; border-radius:8px 10px 12px 9px;
    opacity:.95; transform-origin:79px 79px;
  }
  .spinning .clothes{animation:spin 2.6s linear infinite}
  .fast .clothes{animation-duration:.32s}

  .bubbles{position:absolute; inset:0; pointer-events:none}
  .bub{
    position:absolute; bottom:-14px; width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.25));
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.6); opacity:0}
    20%{opacity:.9}
    100%{transform:translateY(-170px) scale(1.1); opacity:0}
  }

  /* progreso */
  .bar{height:9px; border-radius:99px; background:#c3cad8; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
  .bar>i{display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .3s linear}
  .steps{display:flex; justify-content:space-between; margin-top:8px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px}
  .steps b{font-weight:700; color:var(--ink)}

  /* controles */
  .controls{width:min(380px,92vw); display:grid; gap:12px}
  fieldset{border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px; margin:0; background:rgba(255,255,255,.04)}
  legend{padding:0 6px; font-size:12px; color:#9fb0cf; text-transform:uppercase; letter-spacing:1px}
  .progs{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px}
  .prog{
    cursor:pointer; border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:9px 8px;
    background:rgba(255,255,255,.05); color:#e8ecf5; text-align:left; font:inherit; transition:.15s;
  }
  .prog small{display:block; color:#93a0bb; font-size:11px}
  .prog:hover{border-color:var(--accent-2)}
  .prog[aria-pressed="true"]{background:rgba(47,214,165,.16); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row label{display:flex; align-items:center; gap:6px; font-size:13px; color:#cfd8ea}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  button.act{
    cursor:pointer; border:0; border-radius:12px; padding:13px 10px; font:700 15px/1 inherit;
    background:linear-gradient(180deg,var(--accent),#1fae86); color:#05251c;
    box-shadow:0 6px 16px rgba(47,214,165,.3); transition:.15s;
  }
  button.act.ghost{background:rgba(255,255,255,.08); color:#e8ecf5; box-shadow:none; border:1px solid rgba(255,255,255,.18)}
  button.act:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  button.act:not(:disabled):active{transform:translateY(1px)}

  .log{
    width:min(380px,92vw); max-height:120px; overflow:auto; font:12px/1.6 "Courier New",monospace;
    color:#9ad9c3; background:rgba(0,0,0,.35); border-radius:12px; padding:10px 12px;
  }
  .log div{white-space:pre-wrap}

  /* cartel QUE FACHA */
  .facha{
    position:fixed; inset:0; display:none; place-items:center; z-index:50;
    background:radial-gradient(circle at 50% 50%,rgba(47,214,165,.22),rgba(8,10,18,.88));
    backdrop-filter:blur(3px); text-align:center; padding:20px;
  }
  .facha.show{display:grid}
  .facha .card{
    background:rgba(10,16,26,.78); border:1px solid rgba(47,214,165,.35);
    border-radius:24px; padding:28px 26px 24px; max-width:560px; margin:0 auto;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .facha h2{
    margin:0; font-size:clamp(40px,12vw,96px); font-weight:900; letter-spacing:-2px; line-height:1;
    background:linear-gradient(90deg,#fff,#2fd6a5,#1aa8ff,#fff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(47,214,165,.35);
    animation:pop .5s cubic-bezier(.2,1.7,.4,1), tilt 1.4s ease-in-out .5s infinite;
  }
  .facha p{margin:12px 0 22px; color:#d6e2f3}
  @keyframes pop{0%{transform:scale(.3) rotate(-8deg); opacity:0}100%{transform:scale(1) rotate(-3deg); opacity:1}}
  @keyframes tilt{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <h1>Lavarropas <span>“Qué Facha”</span> 3000</h1>
  <p class="sub">Elegí un programa, dale a Iniciar y esperá el final del ciclo.</p>

  <div class="machine" id="machine">
    <div class="top">
      <div class="brand">FACHA WASH</div>
      <div class="leds">
        <i class="led" id="ledPower" title="encendido"></i>
        <i class="led" id="ledRun" title="lavando"></i>
        <i class="led warn" id="ledDoor" title="puerta bloqueada"></i>
      </div>
    </div>

    <div class="display">
      <span class="phase" id="phase">Listo</span>
      <span class="time" id="time">00:00</span>
    </div>

    <div class="door-wrap">
      <div class="door" id="door">
        <div class="glass">
          <div class="drum"></div>
          <div class="clothes" id="clothes"></div>
          <div class="water" id="water"></div>
          <div class="bubbles" id="bubbles"></div>
        </div>
      </div>
    </div>

    <div class="bar"><i id="barFill"></i></div>
    <div class="steps" id="steps">
      <span data-step="0">Llenado</span>
      <span data-step="1">Lavado</span>
      <span data-step="2">Enjuague</span>
      <span data-step="3">Centrifugado</span>
      <span data-step="4">Fin</span>
    </div>
  </div>

  <div class="controls">
    <fieldset>
      <legend>Programa</legend>
      <div class="progs" id="progs"></div>
    </fieldset>

    <fieldset>
      <legend>Opciones</legend>
      <div class="row">
        <label><input type="checkbox" id="optVoice" checked> Voz</label>
        <label><input type="checkbox" id="optBeep" checked> Chicharra</label>
        <label><input type="checkbox" id="optPrewash"> Prelavado</label>
      </div>
    </fieldset>

    <div class="btns">
      <button class="act" id="btnStart">Iniciar</button>
      <button class="act ghost" id="btnCancel" disabled>Cancelar</button>
    </div>
  </div>

  <div class="log" id="log"></div>

  <div class="facha" id="facha" role="alertdialog" aria-live="assertive">
    <div class="card">
      <h2>¡QUÉ FACHA!</h2>
      <p>Ciclo terminado. La ropa salió impecable.</p>
      <button class="act" id="btnOk">Listo</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const PROGRAMS = [
    { id:"rapido",   name:"Rápido",     temp:"30°", rpm:800,  total:12,
      steps:[["Llenado",2],["Lavado",4],["Enjuague",3],["Centrifugado",3]] },
    { id:"normal",   name:"Normal",     temp:"40°", rpm:1000, total:24,
      steps:[["Llenado",3],["Lavado",9],["Enjuague",6],["Centrifugado",6]] },
    { id:"intenso",  name:"Intenso",    temp:"60°", rpm:1200, total:40,
      steps:[["Llenado",4],["Lavado",16],["Enjuague",10],["Centrifugado",10]] },
    { id:"delicado", name:"Delicados",  temp:"20°", rpm:600,  total:18,
      steps:[["Llenado",3],["Lavado",7],["Enjuague",5],["Centrifugado",3]] },
  ];

  const $ = (id) => document.getElementById(id);
  const el = {
    machine:$("machine"), phase:$("phase"), time:$("time"), bar:$("barFill"),
    steps:$("steps"), water:$("water"), bubbles:$("bubbles"), clothes:$("clothes"),
    progs:$("progs"), start:$("btnStart"), cancel:$("btnCancel"), ok:$("btnOk"),
    facha:$("facha"), log:$("log"), door:$("door"),
    ledPower:$("ledPower"), ledRun:$("ledRun"), ledDoor:$("ledDoor"),
    voice:$("optVoice"), beep:$("optBeep"), prewash:$("optPrewash"),
  };

  let program = PROGRAMS[1];
  let plan = [];          // [{name, seconds}]
  let timer = null;
  let elapsed = 0, total = 0;
  let state = "idle";     // idle | running | paused | done

  /* ---------- UI estática ---------- */
  PROGRAMS.forEach((p) => {
    const b = document.createElement("button");
    b.className = "prog";
    b.type = "button";
    b.setAttribute("aria-pressed", String(p === program));
    b.dataset.id = p.id;
    b.innerHTML = `<strong>${p.name}</strong><small>${p.temp} · ${p.rpm} rpm · ${p.total}s</small>`;
    b.addEventListener("click", () => selectProgram(p));
    el.progs.appendChild(b);
  });

  ["#f2545b","#4cc9f0","#ffd166","#9b5de5","#06d6a0","#f4a261"].forEach((c, i) => {
    const d = document.createElement("i");
    d.className = "cloth";
    d.style.background = c;
    d.style.left = (28 + (i % 3) * 34) + "px";
    d.style.top = (44 + Math.floor(i / 3) * 46) + "px";
    d.style.transform = `rotate(${i * 37}deg)`;
    el.clothes.appendChild(d);
  });

  for (let i = 0; i < 12; i++) {
    const b = document.createElement("i");
    b.className = "bub";
    b.style.left = (8 + Math.random() * 84) + "%";
    b.style.animationDuration = (2.4 + Math.random() * 2.6).toFixed(2) + "s";
    b.style.animationDelay = (Math.random() * 3).toFixed(2) + "s";
    b.style.opacity = "0";
    const s = 6 + Math.random() * 10;
    b.style.width = b.style.height = s.toFixed(1) + "px";
    el.bubbles.appendChild(b);
  }

  function selectProgram(p) {
    if (state === "running" || state === "paused") return;
    program = p;
    [...el.progs.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === p.id)));
    log(`Programa: ${p.name} (${p.temp}, ${p.rpm} rpm)`);
    reset();
  }

  function log(msg) {
    const d = document.createElement("div");
    const t = new Date().toLocaleTimeString("es-AR", { hour12:false });
    d.textContent = `[${t}] ${msg}`;
    el.log.appendChild(d);
    el.log.scrollTop = el.log.scrollHeight;
  }

  function mmss(s) {
    const m = Math.floor(s / 60), r = s % 60;
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
  }

  /* ---------- audio ---------- */
  let ac = null;
  const audio = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());

  function beep(freq = 880, dur = 0.16, when = 0, type = "square", gain = 0.12) {
    if (!el.beep.checked) return;
    try {
      const ctx = audio(), t0 = ctx.currentTime + when;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (_) { /* sin audio, sin drama */ }
  }

  function jingle() {
    [[660,0],[880,0.18],[1175,0.36],[1568,0.54]].forEach(([f, w]) => beep(f, 0.22, w, "triangle", 0.1));
  }

  function say(text) {
    if (!el.voice.checked || !("speechSynthesis" in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-AR";
      u.rate = 0.95; u.pitch = 1.15;
      const v = speechSynthesis.getVoices().find((x) => /^es/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (_) { /* ignorar */ }
  }
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  /* ---------- ciclo ---------- */
  function buildPlan() {
    const steps = program.steps.map(([name, seconds]) => ({ name, seconds }));
    if (el.prewash.checked) steps.splice(1, 0, { name:"Prelavado", seconds:Math.max(2, Math.round(program.total * 0.15)) });
    return steps;
  }

  function phaseAt(sec) {
    let acc = 0;
    for (const s of plan) {
      if (sec < acc + s.seconds) return { name:s.name, index:plan.indexOf(s) };
      acc += s.seconds;
    }
    return { name:"Fin", index:plan.length };
  }

  function renderSteps(names) {
    el.steps.innerHTML = "";
    [...names, "Fin"].forEach((n) => {
      const s = document.createElement("span");
      s.textContent = n;
      el.steps.appendChild(s);
    });
  }

  function paintSteps(currentName) {
    [...el.steps.children].forEach((s) => {
      s.innerHTML = s.textContent;
      if (s.textContent === currentName) s.innerHTML = `<b>${s.textContent}</b>`;
    });
  }

  function applyPhase(name) {
    const glassSpin = name === "Lavado" || name === "Prelavado" || name === "Enjuague" || name === "Centrifugado";
    el.door.classList.toggle("spinning", glassSpin);
    el.door.classList.toggle("fast", name === "Centrifugado");
    el.machine.classList.toggle("shake", name === "Centrifugado");
    el.ledRun.classList.toggle("on", state === "running");

    const level = { "Llenado":"55%", "Prelavado":"60%", "Lavado":"62%", "Enjuague":"70%", "Centrifugado":"8%", "Fin":"0%" }[name] || "0%";
    el.water.style.height = level;
  }

  function tick() {
    elapsed++;
    const { name } = phaseAt(elapsed - 1);
    const prev = el.phase.textContent;
    el.phase.textContent = name;
    el.time.textContent = mmss(Math.max(0, total - elapsed));
    el.bar.style.width = Math.min(100, (elapsed / total) * 100) + "%";
    paintSteps(name);
    if (name !== prev) { applyPhase(name); log(`→ ${name}`); beep(520, 0.08, 0, "sine", 0.07); }

    if (elapsed >= total) finish();
  }

  function start() {
    if (state === "running") { pause(); return; }
    if (state === "paused") { resume(); return; }
    if (state === "done") reset();

    plan = buildPlan();
    total = plan.reduce((a, s) => a + s.seconds, 0);
    elapsed = 0;
    state = "running";
    el.ledPower.classList.add("on");
    el.ledDoor.classList.add("on");
    el.start.textContent = "Pausa";
    el.cancel.disabled = false;
    el.time.textContent = mmss(total);
    el.bar.style.width = "0%";
    el.facha.classList.remove("show");
    renderSteps(plan.map((s) => s.name));
    log(`Arranca ciclo ${program.name}: ${total}s (${plan.map((s) => s.name).join(" → ")})`);
    beep(720, 0.12);
    applyPhase("Llenado");
    el.phase.textContent = "Llenado";
    paintSteps("Llenado");
    timer = setInterval(tick, 1000);
  }

  function pause() {
    clearInterval(timer); timer = null;
    state = "paused";
    el.start.textContent = "Reanudar";
    el.phase.textContent = "Pausa";
    el.machine.classList.remove("shake");
    el.door.classList.remove("spinning", "fast");
    el.ledRun.classList.remove("on");
    log("Ciclo en pausa");
  }

  function resume() {
    state = "running";
    el.start.textContent = "Pausa";
    applyPhase(phaseAt(elapsed).name);
    log("Ciclo reanudado");
    timer = setInterval(tick, 1000);
  }

  function reset() {
    clearInterval(timer); timer = null;
    state = "idle"; elapsed = 0; total = 0;
    el.start.textContent = "Iniciar";
    el.cancel.disabled = true;
    el.phase.textContent = "Listo";
    el.time.textContent = "00:00";
    el.bar.style.width = "0%";
    el.water.style.height = "0%";
    el.machine.classList.remove("shake");
    el.door.classList.remove("spinning", "fast");
    el.ledRun.classList.remove("on");
    el.ledDoor.classList.remove("on");
    el.facha.classList.remove("show");
    paintSteps("");
  }

  function cancel() {
    if (state === "idle") return;
    reset();
    log("Ciclo cancelado");
    beep(300, 0.25, 0, "sawtooth", 0.08);
  }

  function finish() {
    clearInterval(timer); timer = null;
    state = "done";
    el.phase.textContent = "Fin";
    el.time.textContent = "00:00";
    el.bar.style.width = "100%";
    paintSteps("Fin");
    applyPhase("Fin");
    el.ledDoor.classList.remove("on");
    el.start.textContent = "Iniciar";
    el.cancel.disabled = true;

    // *** lo importante ***
    log('Lavado terminado → "QUE FACHA"');
    el.facha.classList.add("show");
    jingle();
    setTimeout(() => say("¡Qué facha!"), 650);
    el.ok.focus();
  }

  el.start.addEventListener("click", start);
  el.cancel.addEventListener("click", cancel);
  el.ok.addEventListener("click", () => { el.facha.classList.remove("show"); reset(); });
  el.facha.addEventListener("click", (e) => { if (e.target === el.facha) el.ok.click(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && el.facha.classList.contains("show")) el.ok.click();
    if (e.key === " " && e.target === document.body) { e.preventDefault(); start(); }
  });

  paintSteps("");
  log("Lavarropas listo. Programa por defecto: Normal.");
})();
</script>
</body>
</html>
